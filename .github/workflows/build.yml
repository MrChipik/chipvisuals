name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq chipvisuals.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: chipvisuals
      - uses: actions/upload-artifact@v4
        with:
          name: chipvisuals-jar
          path: chipvisuals/build/libs/*.jar
